# Publishes the already-encrypted upload-to-netlify/ folder as-is.
# No build runs here: the password and plaintext sources never leave your machine.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish plaintext
        run: |
          if [ -e src ] || grep -rlI "NRIC" upload-to-netlify --exclude-dir=p; then
            echo "Plaintext content found; not publishing." >&2; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: upload-to-netlify
      - id: deployment
        uses: actions/deploy-pages@v4
